services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_agents
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_agents"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    volumes:
      - ./rabbitmq/20-credentials.conf:/etc/rabbitmq/conf.d/20-credentials.conf:ro
      - ./rabbitmq/spotmetrics_credential_validator.erl:/etc/rabbitmq/spotmetrics_credential_validator.erl:ro
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -pa /tmp/rabbitmq-validators
    command:
      - sh
      - -ec
      - |
        mkdir -p /tmp/rabbitmq-validators
        erlc -Werror -pa /opt/rabbitmq/plugins/rabbit-*/ebin -o /tmp/rabbitmq-validators /etc/rabbitmq/spotmetrics_credential_validator.erl
        exec docker-entrypoint.sh rabbitmq-server
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 60s

  api:
    build: .
    command: sh -c "npm run migration:run && npm run seed && node dist/main.js"
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ai_agents
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXECUTIONS_QUEUE: agent-executions
      RABBITMQ_PUBLISH_TIMEOUT_MS: ${RABBITMQ_PUBLISH_TIMEOUT_MS:-5000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build: .
    command: node dist/worker.js
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ai_agents
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXECUTIONS_QUEUE: agent-executions
      RABBITMQ_PUBLISH_TIMEOUT_MS: ${RABBITMQ_PUBLISH_TIMEOUT_MS:-5000}
      RABBITMQ_PREFETCH: 5
      RABBITMQ_MAX_ATTEMPTS: ${RABBITMQ_MAX_ATTEMPTS:-3}
      RABBITMQ_RETRY_DELAY_MS: ${RABBITMQ_RETRY_DELAY_MS:-1000}
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-2000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
